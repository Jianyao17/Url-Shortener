<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Base background -->
  <rect width="600" height="400" rx="20" fill="url(#bg-gradient)"/>
  
  <!-- Abstract chain/link shapes -->
  <path d="M150 200 C 180 160, 220 160, 250 200 S 320 240, 350 200" stroke="url(#line-grad-1)" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M250 200 C 280 160, 320 160, 350 200 S 420 240, 450 200" stroke="url(#line-grad-2)" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M350 200 C 380 160, 420 160, 450 200 S 520 240, 550 200" stroke="url(#line-grad-3)" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Floating circle elements -->
  <circle cx="120" cy="150" r="15" fill="url(#circ-grad-1)" />
  <circle cx="480" cy="250" r="25" fill="url(#circ-grad-2)" />
  <circle cx="500" cy="100" r="10" fill="url(#circ-grad-3)" />

  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2c3e50" class="dark-stop-1" />
      <stop offset="1" stop-color="#34495e" class="dark-stop-2" />
    </linearGradient>
    <linearGradient id="line-grad-1" x1="150" y1="200" x2="350" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e74c3c" />
      <stop offset="1" stop-color="#c0392b" />
    </linearGradient>
    <linearGradient id="line-grad-2" x1="250" y1="200" x2="450" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e74c3c" />
      <stop offset="1" stop-color="#c0392b" />
    </linearGradient>
     <linearGradient id="line-grad-3" x1="350" y1="200" x2="550" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e74c3c" />
      <stop offset="1" stop-color="#c0392b" />
    </linearGradient>

    <radialGradient id="circ-grad-1">
        <stop stop-color="#e74c3c" />
        <stop offset="1" stop-color="#c0392b" />
    </radialGradient>
    <radialGradient id="circ-grad-2">
        <stop stop-color="#e74c3c" />
        <stop offset="1" stop-color="#c0392b" />
    </radialGradient>
    <radialGradient id="circ-grad-3">
        <stop stop-color="#e74c3c" />
        <stop offset="1" stop-color="#c0392b" />
    </radialGradient>
  </defs>
  
  <style>
    .dark .dark-stop-1 {
        stop-color: #1a202c;
    }
    .dark .dark-stop-2 {
        stop-color: #2d3748;
    }
  </style>
</svg>
